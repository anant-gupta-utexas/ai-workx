name: Visual skills

on:
  push:
    paths: ['plugins/visual-skills/**', '.github/workflows/visual-skills.yml', '.claude-plugin/marketplace.json']
  pull_request:
    paths: ['plugins/visual-skills/**', '.github/workflows/visual-skills.yml', '.claude-plugin/marketplace.json']

permissions:
  contents: read

jobs:
  diagram:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/visual-skills/skills/diagram/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            plugins/visual-skills/skills/diagram/scripts/package-lock.json
            plugins/visual-skills/skills/diagram/scripts/art/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - run: npm ci --prefix art --ignore-scripts
      - run: npm run test:art

  visual-brief:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/visual-skills/skills/visual-brief/scripts/colloquium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: plugins/visual-skills/skills/visual-brief/scripts/colloquium/uv.lock
      - run: uv sync --frozen --group dev
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: uv run --frozen --group dev python -m pytest -q
        env:
          VISUAL_SKILLS_PDF_SMOKE: '1'
