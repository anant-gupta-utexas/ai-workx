[project]
name = "ai-workx-colloquium-adapter"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "colloquium @ git+https://github.com/natolambert/colloquium@f22ab9bf4328482e4555bdd4ae85734e69e0f116",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=adapter --cov=bundle --cov-report=term-missing --cov-fail-under=80"
